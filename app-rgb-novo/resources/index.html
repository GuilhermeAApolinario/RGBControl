<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Control — Periféricos & Iluminação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0c0d10;
            --bg-nav: #000000;
            --bg-card: #18191c;
            --bg-card-hover: #202226;
            --border-subtle: #292a2d;
            --text-primary: #ffffff;
            --text-secondary: #8e9299;
            --accent-blue: #00b4d8;
            --accent-glow: rgba(0, 180, 216, 0.25);
            --status-green: #2ec4b6;
            --danger-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Header */
        header {
            background-color: var(--bg-nav);
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo span {
            color: var(--accent-blue);
        }

        nav {
            display: flex;
            gap: 16px;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 14px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        nav a.active, nav a:hover {
            color: var(--text-primary);
            border-bottom-color: var(--accent-blue);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Botão Mestre de Modo Luz On/Off */
        .master-power-btn {
            background: #141518;
            border: 1px solid var(--border-subtle);
            color: var(--status-green);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .master-power-btn.off {
            color: var(--danger-red);
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.08);
        }

        .power-indicator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 6px currentColor;
        }

        /* Layout Principal Responsivo */
        main {
            flex: 1;
            display: flex;
            padding: 16px;
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex-wrap: wrap;
        }

        /* Grelha de Dispositivos */
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            flex: 1;
            min-width: 280px;
            align-content: start;
        }

        .device-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .device-card:hover {
            background-color: var(--bg-card-hover);
            border-color: #3b3d42;
            transform: translateY(-2px);
        }

        .device-card.selected {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .device-header {
            width: 100%;
            text-align: left;
            margin-bottom: 4px;
        }

        .device-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .battery-info {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 2px;
        }

        .battery-icon {
            display: inline-block;
            width: 14px;
            height: 8px;
            border: 1px solid var(--text-secondary);
            border-radius: 2px;
            position: relative;
            padding: 1px;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 1px;
            width: 1px;
            height: 3px;
            background: var(--text-secondary);
        }

        .battery-fill {
            height: 100%;
            background: var(--status-green);
            border-radius: 1px;
        }

        .device-image-placeholder {
            width: 65px;
            height: 65px;
            margin: 6px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%);
        }

        .device-image-placeholder svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: var(--text-primary);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.9;
        }

        .device-status-text {
            font-size: 0.7rem;
            color: var(--status-green);
            text-align: center;
            white-space: nowrap;
        }

        /* Janela Inteligente Lateral */
        .lighting-panel {
            width: 100%;
            max-width: 384px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: fit-content;
        }

        .panel-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 8px;
            background: #111215;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--accent-blue);
        }

        .color-presets {
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }

        .color-swatch {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.selected {
            border-color: #ffffff;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
        }

        .range-slider {
            width: 100%;
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        .status-msg {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: -2px;
        }

        @media (max-width: 420px) {
            body {
                width: 384px;
                height: 384px;
                overflow: auto;
            }
            header {
                padding: 0 10px;
                height: 44px;
            }
            .logo {
                font-size: 0.95rem;
            }
            main {
                padding: 10px;
                gap: 10px;
            }
            .devices-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .device-card {
                padding: 8px;
            }
            .device-image-placeholder {
                width: 48px;
                height: 48px;
                margin: 4px 0;
            }
            .device-image-placeholder svg {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo">RGB<span>Control</span></div>
            <nav>
                <a href="#" class="active">Dispositivos</a>
            </nav>
        </div>
        <div class="header-right">
            <button class="master-power-btn" id="master-power-btn" onclick="toggleMasterPower()">
                <div class="power-indicator"></div>
                <span id="power-text">Luz: ON</span>
            </button>
        </div>
    </header>

    <main>
        <!-- Grelha de Dispositivos -->
        <div class="devices-grid" id="devices-container">
            
            <!-- Placa-Mãe -->
            <div class="device-card" onclick="selectDevice('Placa-Mãe ARGB', 'N/A (Energia)', this, true)">
                <div class="device-header">
                    <div class="device-title">PLACA-MÃE</div>
                    <div class="battery-info" style="color: var(--accent-blue);">
                        <span>Alimentação</span>
                    </div>
                </div>
                <div class="device-image-placeholder">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="1.5"></rect>
                        <path d="M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7z"></path>
                        <line x1="10" y1="8.5" x2="14" y2="8.5"></line>
                        <line x1="8.5" y1="10" x2="8.5" y2="14"></line>
                        <path d="M14 14h3.5v3.5H14z" stroke-dasharray="1 1"></path>
                    </svg>
                </div>
                <div class="device-status-text">● Headers ARGB</div>
            </div>

            <!-- Mouse -->
            <div class="device-card selected" onclick="selectDevice('G703 LIGHTSPEED', '95%', this, false)">
                <div class="device-header">
                    <div class="device-title">G703 MOUSE</div>
                    <div class="battery-info" id="mouse-battery-label">
                        <span>95%</span>
                        <div class="battery-icon">
                            <div class="battery-fill" id="mouse-battery-fill" style="width: 95%;"></div>
                        </div>
                    </div>
                </div>
                <div class="device-image-placeholder">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2a6 6 0 0 0-6 6v8a6 6 0 0 0 12 0V8a6 6 0 0 0-6-6z"></path>
                        <line x1="12" y1="2" x2="12" y2="10"></line>
                        <path d="M9 6h6"></path>
                    </svg>
                </div>
                <div class="device-status-text">● Sem Fios</div>
            </div>

            <!-- Teclado -->
            <div class="device-card" onclick="selectDevice('PRO X KEYBOARD', '80%', this, false)">
                <div class="device-header">
                    <div class="device-title">PRO X TECLADO</div>
                    <div class="battery-info">
                        <span>80%</span>
                        <div class="battery-icon">
                            <div class="battery-fill" style="width: 80%;"></div>
                        </div>
                    </div>
                </div>
                <div class="device-image-placeholder">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="5" y1="9" x2="7" y2="9"></line>
                        <line x1="9" y1="9" x2="11" y2="9"></line>
                        <line x1="13" y1="9" x2="15" y2="9"></line>
                        <line x1="17" y1="9" x2="19" y2="9"></line>
                        <line x1="5" y1="13" x2="8" y2="13"></line>
                        <line x1="10" y1="13" x2="14" y2="13"></line>
                        <line x1="6" y1="17" x2="18" y2="17"></line>
                    </svg>
                </div>
                <div class="device-status-text">● USB</div>
            </div>

            <!-- Headset -->
            <div class="device-card" onclick="selectDevice('PRO X HEADSET', '60%', this, false)">
                <div class="device-header">
                    <div class="device-title">PRO X HEADSET</div>
                    <div class="battery-info">
                        <span>60%</span>
                        <div class="battery-icon">
                            <div class="battery-fill" style="width: 60%; background: #f59e0b;"></div>
                        </div>
                    </div>
                </div>
                <div class="device-image-placeholder">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                    </svg>
                </div>
                <div class="device-status-text">● Bluetooth</div>
            </div>

        </div>

        <!-- Janela Inteligente Lateral com Controlo de DPI e RGB Real -->
        <div class="lighting-panel">
            <div class="panel-title">
                <span id="active-device-name">G703 MOUSE</span>
                <span style="font-size: 0.7rem; color: var(--accent-blue);">Config Hardware</span>
            </div>

            <div class="control-group" id="battery-status-group">
                <label class="control-label">Bateria</label>
                <div id="active-battery-text" style="font-size: 0.8rem; font-weight: 600; color: var(--status-green);">95% (Ótimo)</div>
            </div>

            <!-- Controlo de DPI -->
            <div class="control-group" id="dpi-control-group">
                <label class="control-label">Sensibilidade DPI (<span id="dpi-val">800</span> DPI)</label>
                <select id="dpi-select" onchange="updateDpiValue(this.value)">
                    <option value="400">400 DPI (Baixa)</option>
                    <option value="800" selected>800 DPI (Padrão)</option>
                    <option value="1600">1600 DPI (Rápida)</option>
                    <option value="3200">3200 DPI (Competitiva)</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Modo Animação RGB</label>
                <select id="effect-select">
                    <option value="fixed">Fixo (Cor Estática)</option>
                    <option value="cycle">Ciclo de Cores</option>
                    <option value="breathing">Respirar (Pulse)</option>
                    <option value="wave">Onda ARGB</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Cores</label>
                <div class="color-presets">
                    <div class="color-swatch selected" style="background: #00b4d8;" onclick="setPresetColor(this)"></div>
                    <div class="color-swatch" style="background: #7209b7;" onclick="setPresetColor(this)"></div>
                    <div class="color-swatch" style="background: #f72585;" onclick="setPresetColor(this)"></div>
                    <div class="color-swatch" style="background: #4cc9f0;" onclick="setPresetColor(this)"></div>
                    <input type="color" id="custom-color" value="#00b4d8">
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Brilho (<span id="bright-val">100</span>%)</label>
                <input type="range" class="range-slider" min="0" max="100" value="100" oninput="document.getElementById('bright-val').innerText = this.value">
            </div>

            <div class="status-msg" id="panel-status-msg">Alterações aplicadas ao hardware.</div>
        </div>
    </main>

    <script src="js/neutralino.js"></script>
    <script>
        // Inicializa o Neutralinojs
        Neutralino.init();

        let isMasterOn = true;
        let selectedDeviceType = 'mouse';
        let currentDpi = 800;

        // 1. CONFIGURAÇÃO DA BANDEJA DO SISTEMA COM ÍCONE PERSONALIZADO
        function setupSystemTray() {
            if (typeof Neutralino.os.setTray === 'function') {
                let tray = {
                    icon: '/resources/icons/trayIcon.png',
                    menuItems: [
                        { id: "SHOW", text: "Abrir RGB Control" },
                        { id: "SEP", text: "-" },
                        { id: "QUIT", text: "Sair do Aplicativo" }
                    ]
                };
                Neutralino.os.setTray(tray);
            }

            Neutralino.events.on("trayMenuItemClicked", (event) => {
                if (event.detail.id === "SHOW") {
                    Neutralino.window.show();
                    Neutralino.window.focus();
                } else if (event.detail.id === "QUIT") {
                    Neutralino.app.exit();
                }
            });

            Neutralino.events.on("windowClose", () => {
                Neutralino.window.hide();
            });
        }

        setupSystemTray();

        // 2. MONITOR DE BATERIA EM SEGUNDO PLANO
        let lastNotifiedBattery = 100;
        function checkBatteryStatusInBackground() {
            let currentMouseBattery = 12; 
            if (currentMouseBattery <= 15 && lastNotifiedBattery > 15) {
                if (typeof Neutralino.os.showNotification === 'function') {
                    Neutralino.os.showNotification(
                        "⚠️ Bateria Fraca — RGB Control", 
                        `O seu G703 Lightspeed está com ${currentMouseBattery}% de bateria.`
                    );
                }
            }
            lastNotifiedBattery = currentMouseBattery;
        }
        setInterval(checkBatteryStatusInBackground, 60000);

        // 3. COMANDOS DE HARDWARE REAIS (PYTHON + NATIVO)
        async function updateDpiValue(dpi) {
            currentDpi = dpi;
            document.getElementById('dpi-val').innerText = dpi;
            triggerHardwareUpdate();
        }

        async function applyRGBHardware(colorHex, effectMode, brightness) {
            const payload = JSON.stringify({
                device: selectedDeviceType,
                color: colorHex,
                effect: effectMode,
                brightness: parseInt(brightness),
                dpi: parseInt(currentDpi)
            });

            try {
                if (typeof Neutralino.os.execCommand === 'function') {
                    await Neutralino.os.execCommand(`python server/hardware_controller.py '${payload}'`);
                    document.getElementById('panel-status-msg').innerText = "✅ Hardware atualizado!";
                }
            } catch (err) {
                console.warn("Modo simulação ativo:", err);
                document.getElementById('panel-status-msg').innerText = "⚠️ Simulação ativa (Sem script Python detetado).";
            }
        }

        function selectDevice(name, batteryInfo, cardEl, isMotherboard) {
            document.querySelectorAll('.device-card').forEach(c => c.classList.remove('selected'));
            cardEl.classList.add('selected');
            
            document.getElementById('active-device-name').innerText = name;
            
            const batteryGroup = document.getElementById('battery-status-group');
            if (isMotherboard) {
                batteryGroup.style.display = 'none';
                selectedDeviceType = 'motherboard';
            } else {
                batteryGroup.style.display = 'flex';
                document.getElementById('active-battery-text').innerText = batteryInfo;
                if (name.includes('MOUSE')) selectedDeviceType = 'mouse';
                else if (name.includes('TECLADO')) selectedDeviceType = 'keyboard';
                else if (name.includes('HEADSET')) selectedDeviceType = 'headset';
            }

            triggerHardwareUpdate();
        }

        function setPresetColor(el) {
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            const rgbColor = el.style.backgroundColor;
            document.getElementById('custom-color').value = rgbToHex(rgbColor);
            triggerHardwareUpdate();
        }

        function toggleMasterPower() {
            isMasterOn = !isMasterOn;
            const btn = document.getElementById('master-power-btn');
            const powerText = document.getElementById('power-text');
            const panelMsg = document.getElementById('panel-status-msg');

            if (isMasterOn) {
                btn.classList.remove('off');
                powerText.innerText = "Luz: ON";
                panelMsg.innerText = "Iluminação ativa.";
                triggerHardwareUpdate();
            } else {
                btn.classList.add('off');
                powerText.innerText = "Luz: OFF";
                panelMsg.innerText = "⚠️ MODO ESCURO ATIVO.";
                applyRGBHardware('#000000', 'fixed', 0);
            }
        }

        function triggerHardwareUpdate() {
            if (!isMasterOn) return;
            const color = document.getElementById('custom-color').value;
            const effect = document.getElementById('effect-select').value;
            const brightness = document.getElementById('bright-val').innerText;
            applyRGBHardware(color, effect, brightness);
        }

        function rgbToHex(rgb) {
            if (rgb.startsWith('#')) return rgb;
            const rgbValues = rgb.match(/\d+/g);
            if (!rgbValues) return '#00b4d8';
            return "#" + ((1 << 24) + (parseInt(rgbValues[0]) << 16) + (parseInt(rgbValues[1]) << 8) + parseInt(rgbValues[2])).toString(16).slice(1);
        }

        // Event Listeners
        document.getElementById('effect-select').addEventListener('change', triggerHardwareUpdate);
        document.getElementById('custom-color').addEventListener('input', triggerHardwareUpdate);
        document.querySelector('.range-slider').addEventListener('change', triggerHardwareUpdate);
    </script>
</body>
</html>
